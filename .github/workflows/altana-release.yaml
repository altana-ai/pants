# Builds the bootstrap PEXes this fork exists to provide and attaches them to a GitHub
# release. Not a substitute for `release.yaml`: that one is gated on
# `github.repository_owner == 'pantsbuild'`, runs on Depot runners this fork has no access
# to, and also publishes wheels and attestations. None of that is needed to bootstrap Pants
# at Altana.
#
# What is needed is exactly the artifact scie-pants asks for by name through
# PANTS_BOOTSTRAP_URLS: `pants.<version>-cp<tag>-<platform>.pex`. The interpreter tag is a
# property of the release rather than of the version (2.30/2.31 shipped cp311, 2.32/2.33
# ship cp314), so it is read back off the built PEX instead of hardcoded.
#
# Three platforms, because all three are places Pants is run here: linux_x86_64 for the
# Buildkite agents, linux_aarch64 for Coder workspaces, darwin_arm64 for laptops. A missing
# platform is not a degraded experience, it is a hard bootstrap failure for whoever is on it.
name: Altana release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to create for this release, e.g. release_2.33.0+altana.1"
        required: true
      platforms:
        description: "Which platforms to build. Use one platform to re-run it after a flake without rebuilding the others."
        required: true
        default: all
        type: choice
        options:
          - all
          - linux_x86_64
          - linux_aarch64
          - darwin_arm64

permissions:
  contents: write

jobs:
  build_linux:
    name: Build PEX (${{ matrix.platform }})
    if: inputs.platforms == 'all' || inputs.platforms == matrix.platform
    runs-on: ${{ matrix.runs-on }}
    container:
      image: ${{ matrix.container }}
    env:
      # The manylinux images predate the glibc the GitHub Actions node runtime wants.
      ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true
      # This fork has no remote cache, and pants would otherwise try the upstream one.
      PANTS_REMOTE_CACHE_READ: "false"
      PANTS_REMOTE_CACHE_WRITE: "false"
      PANTS_PROCESS_EXECUTION_LOCAL_PARALLELISM: "1"
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux_x86_64
            runs-on: ubuntu-24.04
            container: quay.io/pypa/manylinux_2_28_x86_64:latest
            protoc_arch: x86_64
          - platform: linux_aarch64
            runs-on: ubuntu-24.04-arm
            container: quay.io/pypa/manylinux_2_28_aarch64:latest
            protoc_arch: aarch_64
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 10

      - name: Configure Git
        run: git config --global safe.directory "$GITHUB_WORKSPACE"

      - name: Expose the container's CPythons
        run: |
          echo "/opt/python/cp311-cp311/bin" >> $GITHUB_PATH
          echo "/opt/python/cp312-cp312/bin" >> $GITHUB_PATH
          echo "/opt/python/cp313-cp313/bin" >> $GITHUB_PATH
          echo "/opt/python/cp314-cp314/bin" >> $GITHUB_PATH

      - name: Install rustup
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs -o /tmp/rustup.sh
          sh /tmp/rustup.sh -y --default-toolchain none
          echo "${HOME}/.cargo/bin" >> $GITHUB_PATH

      - name: Install protoc
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/protoc.zip \
            "https://github.com/protocolbuffers/protobuf/releases/download/v23.4/protoc-23.4-linux-${{ matrix.protoc_arch }}.zip"
          unzip -o /tmp/protoc.zip -d /usr/local bin/protoc 'include/*'
          protoc --version

      - name: Cache Cargo
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4
        with:
          cache-bin: "false"
          shared-key: engine-${{ matrix.platform }}
          workspaces: src/rust

      - name: Build Pants PEX
        run: ./pants package src/python/pants:pants-pex

      - name: Name the PEX the way scie-pants asks for it
        id: name
        run: |
          set -euo pipefail
          PEX=dist/src.python.pants/pants-pex.pex
          PANTS_VER=$(PEX_INTERPRETER=1 $PEX -c "import pants.version;print(pants.version.VERSION)")
          PY_VER=$(PEX_INTERPRETER=1 $PEX -c "import sys;print(f'cp{sys.version_info[0]}{sys.version_info[1]}{sys.abiflags}')")
          PLAT=$(PEX_INTERPRETER=1 $PEX -c "import os;print(f'{os.uname().sysname.lower()}_{os.uname().machine.lower()}')")
          PEX_FILENAME=pants.$PANTS_VER-$PY_VER-$PLAT.pex
          # The runner's own arch, not the matrix label: a cross-built PEX under the wrong
          # name is the failure that looks like a working release until someone runs it.
          test "$PLAT" = "${{ matrix.platform }}"
          mv "$PEX" "dist/src.python.pants/$PEX_FILENAME"
          echo "filename=$PEX_FILENAME" | tee -a "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: pex-${{ matrix.platform }}
          path: dist/src.python.pants/${{ steps.name.outputs.filename }}
          if-no-files-found: error

      - name: Upload pants.log on failure
        if: failure()
        continue-on-error: true
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: logs-${{ matrix.platform }}
          path: .pants.d/workdir/*.log

  build_macos:
    name: Build PEX (darwin_arm64)
    if: inputs.platforms == 'all' || inputs.platforms == 'darwin_arm64'
    # macos-14 is arm64 and matches the deployment target below. No container: macOS
    # runners cannot run one, which is why this is a separate job from the Linux matrix.
    runs-on: macos-14
    env:
      ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: false
      PANTS_REMOTE_CACHE_READ: "false"
      PANTS_REMOTE_CACHE_WRITE: "false"
      PANTS_PROCESS_EXECUTION_LOCAL_PARALLELISM: "1"
      # Both are what make the native extensions arm64 rather than whatever the host
      # Python was built for; upstream's macOS job sets the same pair.
      ARCHFLAGS: "-arch arm64"
      _PYTHON_HOST_PLATFORM: macosx-14.0-arm64
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 10

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: |-
            3.11
            3.12
            3.13
            3.14

      - name: Install protoc
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/protoc.zip \
            "https://github.com/protocolbuffers/protobuf/releases/download/v23.4/protoc-23.4-osx-aarch_64.zip"
          sudo unzip -o /tmp/protoc.zip -d /usr/local bin/protoc 'include/*'
          protoc --version

      - name: Set rustup profile
        run: rustup set profile default

      - name: Cache Cargo
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4
        with:
          cache-bin: "false"
          shared-key: engine-darwin_arm64
          workspaces: src/rust

      - name: Build Pants PEX
        run: ./pants package src/python/pants:pants-pex

      - name: Name the PEX the way scie-pants asks for it
        id: name
        run: |
          set -euo pipefail
          PEX=dist/src.python.pants/pants-pex.pex
          PANTS_VER=$(PEX_INTERPRETER=1 $PEX -c "import pants.version;print(pants.version.VERSION)")
          PY_VER=$(PEX_INTERPRETER=1 $PEX -c "import sys;print(f'cp{sys.version_info[0]}{sys.version_info[1]}{sys.abiflags}')")
          PLAT=$(PEX_INTERPRETER=1 $PEX -c "import os;print(f'{os.uname().sysname.lower()}_{os.uname().machine.lower()}')")
          PEX_FILENAME=pants.$PANTS_VER-$PY_VER-$PLAT.pex
          test "$PLAT" = "darwin_arm64"
          mv "$PEX" "dist/src.python.pants/$PEX_FILENAME"
          echo "filename=$PEX_FILENAME" | tee -a "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: pex-darwin_arm64
          path: dist/src.python.pants/${{ steps.name.outputs.filename }}
          if-no-files-found: error

      - name: Upload pants.log on failure
        if: failure()
        continue-on-error: true
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: logs-darwin_arm64
          path: .pants.d/workdir/*.log

  release:
    name: Attach the PEXes to a release
    needs: [build_linux, build_macos]
    # Runs when the platforms that were asked for succeeded, so a single-platform re-run
    # can add its artifact to an existing release without the skipped jobs blocking it.
    if: always() && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@448e3f862ab3ef47aa50ff917776823c9946035b # v6.0.0
        with:
          path: pexes
          merge-multiple: true

      - name: Create or update the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          ls -la pexes
          # Idempotent so a single-platform re-run adds to the release rather than failing
          # on a tag that already exists.
          if gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release upload "$TAG" --repo "${{ github.repository }}" --clobber pexes/*.pex
          else
            gh release create "$TAG" \
              --repo "${{ github.repository }}" \
              --title "$TAG" \
              --notes "Altana fork build. Bootstrap PEXes named as scie-pants requests them through PANTS_BOOTSTRAP_URLS." \
              pexes/*.pex
          fi
          gh release view "$TAG" --repo "${{ github.repository }}" --json assets \
            --jq '.assets[].name'
